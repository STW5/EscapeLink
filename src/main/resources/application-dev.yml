spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:escapelink}
    username: ${DB_USERNAME:escapelink}
    password: ${DB_PASSWORD:escapelink}
    driver-class-name: org.postgresql.Driver

escapelink:
  team-session:
    cookie-secure: false

logging:
  level:
    com.stw.escapelink: DEBUG
    org.hibernate.SQL: DEBUG
